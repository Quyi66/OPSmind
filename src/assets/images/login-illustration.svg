<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.1);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.05);stop-opacity:1" />
    </linearGradient>

    <!-- 3D effect gradients -->
    <linearGradient id="blueGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="blueGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E88E5;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="blueGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64B5F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="lightBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="transparent"/>

  <!-- Central 3D platform -->
  <g transform="translate(200, 150)">
    <!-- Main platform base -->
    <ellipse cx="0" cy="50" rx="120" ry="20" fill="url(#lightBlue)" opacity="0.3"/>

    <!-- 3D Laptop/Monitor setup -->
    <g transform="translate(-60, -20)">
      <!-- Monitor stand -->
      <rect x="55" y="30" width="10" height="25" fill="url(#blueGradient1)" filter="url(#softShadow)"/>
      <rect x="45" y="55" width="30" height="8" rx="4" fill="url(#blueGradient1)" filter="url(#softShadow)"/>

      <!-- Main monitor -->
      <rect x="20" y="-10" width="80" height="50" rx="4" fill="url(#blueGradient2)" filter="url(#shadow)"/>
      <rect x="25" y="-5" width="70" height="40" rx="2" fill="#E8F4FD"/>

      <!-- Monitor content -->
      <rect x="30" y="0" width="25" height="4" rx="1" fill="#2196F3"/>
      <rect x="30" y="8" width="35" height="3" rx="1" fill="#42A5F5"/>
      <rect x="30" y="15" width="30" height="3" rx="1" fill="#64B5F6"/>

      <!-- Chart area -->
      <rect x="45" y="20" width="20" height="12" rx="1" fill="#F0F8FF"/>
      <path d="M47 30 L52 25 L57 28 L62 23" stroke="#2196F3" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Side laptop -->
    <g transform="translate(40, 10) rotate(15)">
      <!-- Laptop base -->
      <path d="M0 20 L40 20 L38 28 L2 28 Z" fill="url(#blueGradient1)" filter="url(#softShadow)"/>
      <!-- Laptop screen -->
      <rect x="5" y="5" width="30" height="18" rx="2" fill="url(#blueGradient3)" filter="url(#softShadow)"/>
      <rect x="7" y="7" width="26" height="14" rx="1" fill="#E8F4FD"/>
    </g>
  </g>

  <!-- Floating elements -->
  <!-- Cloud -->
  <g transform="translate(50, 40)">
    <ellipse cx="20" cy="15" rx="15" ry="8" fill="url(#blueGradient3)" opacity="0.8"/>
    <ellipse cx="35" cy="15" rx="12" ry="6" fill="url(#blueGradient3)" opacity="0.8"/>
    <ellipse cx="27" cy="8" rx="10" ry="5" fill="url(#blueGradient3)" opacity="0.8"/>
  </g>

  <!-- Data cubes -->
  <g transform="translate(300, 60)">
    <!-- Cube 1 -->
    <path d="M0 20 L15 10 L30 20 L30 35 L15 45 L0 35 Z" fill="url(#blueGradient1)" opacity="0.9"/>
    <path d="M0 20 L15 10 L15 25 L0 35 Z" fill="url(#blueGradient2)" opacity="0.7"/>
    <path d="M15 10 L30 20 L30 35 L15 25 Z" fill="url(#blueGradient3)" opacity="0.8"/>
  </g>

  <g transform="translate(320, 100)">
    <!-- Cube 2 -->
    <path d="M0 15 L10 8 L20 15 L20 25 L10 32 L0 25 Z" fill="url(#blueGradient2)" opacity="0.8"/>
    <path d="M0 15 L10 8 L10 18 L0 25 Z" fill="url(#blueGradient3)" opacity="0.6"/>
    <path d="M10 8 L20 15 L20 25 L10 18 Z" fill="url(#blueGradient1)" opacity="0.7"/>
  </g>

  <!-- Network connections -->
  <g opacity="0.6">
    <circle cx="120" cy="80" r="3" fill="#2196F3"/>
    <circle cx="180" cy="60" r="3" fill="#2196F3"/>
    <circle cx="250" cy="90" r="3" fill="#2196F3"/>

    <line x1="120" y1="80" x2="180" y2="60" stroke="#2196F3" stroke-width="1" opacity="0.5"/>
    <line x1="180" y1="60" x2="250" y2="90" stroke="#2196F3" stroke-width="1" opacity="0.5"/>
    <line x1="250" y1="90" x2="120" y2="80" stroke="#2196F3" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Floating icons -->
  <g transform="translate(60, 200)">
    <!-- Settings gear -->
    <circle cx="15" cy="15" r="8" fill="none" stroke="url(#blueGradient1)" stroke-width="2" opacity="0.7"/>
    <circle cx="15" cy="15" r="3" fill="url(#blueGradient1)" opacity="0.7"/>
  </g>

  <g transform="translate(280, 180)">
    <!-- Shield -->
    <path d="M15 5 L25 10 L25 20 C25 25 20 28 15 30 C10 28 5 25 5 20 L5 10 Z" fill="url(#blueGradient2)" opacity="0.7"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="350" cy="50" r="2" fill="#64B5F6" opacity="0.5"/>
  <circle cx="370" cy="70" r="1.5" fill="#42A5F5" opacity="0.6"/>
  <circle cx="30" cy="100" r="2" fill="#2196F3" opacity="0.4"/>
  <circle cx="50" cy="250" r="1.5" fill="#1976D2" opacity="0.5"/>
</svg>
