<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPS智能助手 · 气泡</title>
  <link rel="icon" type="image/png" href="icons/aiOPS2.png">
  <!-- Runtime config rendered by entrypoint (if present) -->
  <script src="runtime-config.js" defer></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #fff;
      overflow: hidden; /* prevent double scrollbars in iframe */
    }
    /* Make the chat window occupy the entire iframe viewport */
    #dify-chatbot-bubble-window {
      position: fixed !important;
      inset: 0 !important; /* top/right/bottom/left = 0 */
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      border-radius: 0 !important;
      border: 0 !important;
      box-shadow: none !important;
    }
    /* Keep the floating bubble button visible in bubble mode.
       If auto-open succeeds, the init script may optionally hide it. */
    /* Compact mode: reduce side avatar footprint to enlarge center content */
    html[data-compact="1"] #dify-chatbot-bubble-window [class*="avatar" i],
    html[data-compact="1"] #dify-chatbot-bubble-window img[alt*="avatar" i],
    html[data-compact="1"] #dify-chatbot-bubble-window [data-testid*="avatar" i] {
      display: none !important;
      width: 0 !important;
      min-width: 0 !important;
    }
    html[data-compact="1"] #dify-chatbot-bubble-window [class*="message" i] {
      max-width: 100% !important;
    }
    /* Hide status text in embedded mode */
    #status { display: none !important; }
  </style>
</head>
<body>
  <div id="status" style="position:fixed;top:12px;left:12px;color:#999;font-size:12px;z-index:2147483647"></div>
  <!-- 使用统一初始化脚本；通过 ?mode=bubble 禁用自动打开与隐藏按钮 -->
  <script src="aiops-embed-init.js?mode=bubble" defer></script>
</body>
</html>
