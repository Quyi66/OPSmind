<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPS智能助手</title>
  <!-- Runtime config rendered by entrypoint (if present) -->
  <script src="runtime-config.js" defer></script>
  <link rel="icon" type="image/png" href="/icons/aiOPS2.png">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #fff;
      overflow: hidden; /* prevent double scrollbars */
    }

    /* Make the chatbot window occupy the full viewport */
    #dify-chatbot-bubble-window {
      position: fixed !important;
      inset: 0 !important; /* top/right/bottom/left = 0 */
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    /* Hide the floating bubble button for a clean full-page view */
    #dify-chatbot-bubble-button {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- 状态文本（可显示加载信息/错误） -->
  <div id="status" style="position:fixed;top:12px;left:12px;color:#999;font-size:12px;z-index:2147483647"></div>
  <!-- 统一初始化：从 URL 或 runtime-config.js 读取 token 与 embed，默认自动打开 -->
  <script src="aiops-embed-init.js" defer></script>
  <style>
    /* Optional: keep your theme color if the button is ever shown */
    #dify-chatbot-bubble-button { background-color: #1C64F2 !important; }
  </style>
</body>
</html>
