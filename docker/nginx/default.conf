server {
    listen 80;
    server_name _;

    # Global root for any top-level assets (not used for alias locations)
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
      text/plain
      text/css
      text/xml
      text/javascript
      application/json
      application/javascript
      application/xml+rss
      application/atom+xml
      image/svg+xml;

    # Security headers (tune as needed)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =============================
    # Backend API/WebSocket proxy
    # =============================
    # These placeholders are substituted at container start by entrypoint (envsubst)
    # BACKEND_SCHEME, BACKEND_HOST, BACKEND_PORT
    set $backend_upstream ${BACKEND_SCHEME}://${BACKEND_HOST}:${BACKEND_PORT};

    location ~ ^/(api|oplus-portal|oplus-upload|oplus-njs|oplus-ws|oplus-jobadm)/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # WebSocket upgrade (where applicable)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =============================
    # opsmind (Vue) served under /ops/
    # =============================
    location ^~ /ops/ {
        alias /usr/share/nginx/html/opsmind/;
        index index.html;

        # Static caching (scoped to this alias)
        location ~* \.(js|css|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri $uri/ =404;
        }

        # SPA fallback
        try_files $uri $uri/ /ops/index.html;
    }

    # Avoid caching HTML entry to prevent stale preload graphs
    location = /ops/index.html { add_header Cache-Control "no-store"; }
    # Ensure /ops/ always serves the SPA entry (avoid occasional 404s)
    location = /ops/ { try_files /opsmind/index.html =404; }

    # Redirect root to opsmind
    location = / { return 302 /ops/; }
    location = /ops { return 302 /ops/; }

    # Optional: backward compatibility to older assets built with /opsmind/base/
    # Keep SPA fallback within the same prefix to avoid serving HTML to JS asset requests
    location ^~ /opsmind/base/ {
        alias /usr/share/nginx/html/opsmind/;
        index index.html;
        try_files $uri $uri/ /opsmind/base/index.html;
    }

    # =============================
    # oplus proxy to internal server (listen ${OPLUS_PORT})
    # =============================
    location ^~ /oplus/ {
        proxy_pass http://127.0.0.1:${OPLUS_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Error pages
    error_page 404 = /ops/index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
