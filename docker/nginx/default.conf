server {
    listen 80;
    server_name _;

    # Global root for any top-level assets (not used for alias locations)
    root /usr/share/nginx/html;
    index index.html;

    # Logging
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # Default upload limit for all routes
    client_max_body_size 100M;

    # Compression (动态压缩)
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types
      text/plain
      text/css
      text/xml
      text/javascript
      application/json
      application/javascript
      application/x-javascript
      application/xml+rss
      application/atom+xml
      image/svg+xml
      font/woff
      font/woff2;

    # 优先使用预压缩文件（需要 ngx_http_gzip_static_module）
    gzip_static on;

    # Brotli 预压缩（如果有 brotli 模块）
    # brotli_static on;

    # Security headers (tune as needed)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =============================
    # Backend API/WebSocket proxy
    # =============================
    # Placeholder substituted at container start by entrypoint (envsubst)
    # Single BACKEND_URL, e.g. http://10.1.40.112:80
    set $backend_upstream ${BACKEND_URL};

    # Increase upload limit for GFS endpoint to 100M
    location ^~ /oplus-portal/gfs {
        # Increase timeouts for large uploads
        client_body_timeout 300s;
        send_timeout 300s;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ ^/(api|oplus-portal|oplus-upload|oplus-njs|oplus-ws|oplus-jobadm|oplus-gfs)/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # WebSocket upgrade (where applicable)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =============================
    # opsmind (Vue) served under /opsMind/
    # =============================
    location ^~ /opsMind/ {
        alias /usr/share/nginx/html/opsmind/;
        index index.html;

        # Static caching (scoped to this alias)
        location ~* \.(js|css|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri $uri/ =404;
        }

        # SPA fallback
        try_files $uri $uri/ /opsMind/index.html;
    }

    # Avoid caching HTML entry to prevent stale preload graphs
    location = /opsMind/index.html { add_header Cache-Control "no-store"; }
    # Ensure /opsMind/ always serves the SPA entry (avoid occasional 404s)
    location = /opsMind/ { try_files /opsmind/index.html =404; }

    # Redirect root to opsmind
    location = / { return 302 /opsMind/; }
    location = /opsMind { return 302 /opsMind/; }

    # Optional: backward compatibility to older assets built with /opsmind/base/
    # Keep SPA fallback within the same prefix to avoid serving HTML to JS asset requests
    location ^~ /opsmind/base/ {
        alias /usr/share/nginx/html/opsmind/;
        index index.html;
        try_files $uri $uri/ /opsmind/base/index.html;
    }

    # Error pages
    error_page 404 = /opsMind/index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
