server {
    listen ${OPLUS_PORT};
    server_name localhost;

    # Use oplus dist as root in this internal server
    root /usr/share/nginx/html/oplus;
    index index.html;

    # Logging
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # Default upload limit for all routes
    client_max_body_size 100M;

    # gzip settings
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
      text/plain
      text/css
      text/xml
      text/javascript
      application/json
      application/javascript
      application/xml+rss
      application/atom+xml
      image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend proxy (use same BACKEND_URL as main)
    # Increase upload limit for GFS endpoint to 100M
    location ^~ /oplus-portal/gfs {
        # Increase timeouts for large uploads
        client_body_timeout 300s;
        send_timeout 300s;
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location ~ ^/(api|oplus-portal|oplus-upload|oplus-njs|oplus-ws|oplus-jobadm)/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Rewrite /oplus/base/* and /oplus/* to root path so Angular assets resolve
    location ^~ /oplus/base/ { rewrite ^/oplus/base/(.*)$ /$1 last; }
    location ^~ /oplus/ { rewrite ^/oplus/(.*)$ /$1 last; }
    location ^~ /oplus-admin/ { rewrite ^/oplus-admin/(.*)$ /$1 last; }

    # Compatibility: emailv2 -> email path mapping
    location ^~ /oplus/base/app/modules/cac/emailv2/ {
        rewrite ^/oplus/base/app/modules/cac/emailv2/(.*)$ /app/modules/cac/email/$1 last;
    }
    location ^~ /oplus/app/modules/cac/emailv2/ {
        rewrite ^/oplus/app/modules/cac/emailv2/(.*)$ /app/modules/cac/email/$1 last;
    }

    # Static assets
    location ~* \.(css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        # Prefer static gzip when available; preserve correct Content-Type
        gzip_static on;
        try_files $uri $uri.gz =404;
    }
    location ~* \.(js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        # Prefer static gzip when available; preserve correct Content-Type
        gzip_static on;
        try_files $uri $uri.gz =404;
    }
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 6M;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Root and SPA fallback
    location / {
        try_files $uri $uri/ @fallback;
    }
    location @fallback {
        rewrite ^.*$ /index.html last;
    }

    # Errors
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html/oplus;
    }
}
