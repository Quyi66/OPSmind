<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPSmind</title>

  <!-- 引入 FontAwesome Pro 图标库（包含 Duotone 图标），与 AngularJS 应用保持一致 -->
  <link rel="stylesheet" href="/fontawesome-pro/css/all.min.css">

  <!-- Runtime config for Dify base/token (used by bubble embed) -->
  <script src="/runtime-config.js" defer></script>

  <!-- 自定义图标字体 -->
  <style>
    /* OPSmind 自定义图标字体 - 使用 FontAwesome 替代 */
    .fa-oplus-jao:before { content: "\f085"; font-family: 'Font Awesome 5 Free'; font-weight: 900; }
    .fa-oplus-gfs:before { content: "\f15b"; font-family: 'Font Awesome 5 Free'; font-weight: 900; }
    .fa-oplus-cmd:before { content: "\f120"; font-family: 'Font Awesome 5 Free'; font-weight: 900; }
    .fa-oplus-acm:before { content: "\f233"; font-family: 'Font Awesome 5 Free'; font-weight: 900; }
    .fa-oplus-applet:before { content: "\f1b2"; font-family: 'Font Awesome 5 Free'; font-weight: 900; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
