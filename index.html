<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KoreOPS 智能运维管理平台">
  <title>KoreOPS</title>

  <!-- 预加载关键字体，使用 font-display: swap 避免 FOIT -->
  <link rel="preload" href="/fontawesome-pro/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>

  <!-- FontAwesome Pro - 延迟加载，使用 media="print" 技巧避免阻塞渲染 -->
  <link rel="stylesheet" href="/fontawesome-pro/css/all.min.css" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="/fontawesome-pro/css/all.min.css">
  </noscript>

  <!-- Runtime config for Dify base/token (used by bubble embed) -->
  <script src="/runtime-config.js" defer></script>

  <!-- 关键 CSS 内联，减少渲染阻塞 -->
  <style>
    /* 首屏关键样式 - 避免布局偏移 */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    #app {
      min-height: 100vh;
    }

    /* 字体显示优化 - 使用 swap 避免 FOIT */
    @font-face {
      font-family: 'Font Awesome 6 Pro';
      font-display: swap;
    }

    @font-face {
      font-family: 'Font Awesome 6 Free';
      font-display: swap;
    }

    /* 首屏加载占位 */
    .app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
      z-index: 9999;
    }

    .app-loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e4e7ed;
      border-top-color: #409eff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* OPSmind 自定义图标字体 - 使用 FontAwesome 替代 */
    .fa-oplus-jao:before {
      content: "\f085";
      font-family: 'Font Awesome 5 Free';
      font-weight: 900;
    }

    .fa-oplus-gfs:before {
      content: "\f15b";
      font-family: 'Font Awesome 5 Free';
      font-weight: 900;
    }

    .fa-oplus-cmd:before {
      content: "\f120";
      font-family: 'Font Awesome 5 Free';
      font-weight: 900;
    }

    .fa-oplus-acm:before {
      content: "\f233";
      font-family: 'Font Awesome 5 Free';
      font-weight: 900;
    }

    .fa-oplus-applet:before {
      content: "\f1b2";
      font-family: 'Font Awesome 5 Free';
      font-weight: 900;
    }
  </style>
</head>

<body>
  <!-- 首屏加载占位符 - 减少 CLS -->
  <div id="app">
    <div class="app-loading">
      <div class="app-loading-spinner"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
